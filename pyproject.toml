[project]
name = "doppelganger"
version = "2.0.0"
description = "Self-hosted private-gallery face matching service"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not models' -q"
markers = [
    "models: needs provisioned ONNX model files (run with `pytest -m models`)",
    "slow: slower tests",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "storage", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"scripts/*" = ["S"]
"migrations/*" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["faiss", "cv2", "dlib", "face_recognition", "alembic.*"]
ignore_missing_imports = true
follow_imports = "skip"
